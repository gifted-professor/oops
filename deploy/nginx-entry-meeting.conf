# Include inside the existing giftedprofessor.xyz public HTTPS server.
location ^~ /oops-meeting/ {
    client_max_body_size 2m;
    client_body_timeout 15s;
    proxy_pass https://103.110.81.78:8444;
    proxy_ssl_server_name on;
    proxy_ssl_name huanqiu-backend.internal;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 1;
    proxy_ssl_trusted_certificate /etc/huanqiu-zhilian-website/backend.crt;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
    proxy_http_version 1.1;
    proxy_set_header Host giftedprofessor.xyz;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie "";
    proxy_set_header X-Abtop-Token "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
}
