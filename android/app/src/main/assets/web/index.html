<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Oops</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">Oops</span>
      <span class="tagline">Never miss what mattered.</span>
    </div>
    <button class="icon-btn" id="btn-ask" aria-label="问答">问</button>
  </header>

  <div class="view" id="view-session">
  <div class="seg" id="session-seg" role="tablist" aria-label="本场或往期">
    <button class="on" data-pane="live" role="tab">本场</button><button data-pane="history" role="tab">往期会议</button>
  </div>
  <div class="pane" id="pane-live">
  <section class="status" aria-live="polite">
    <div class="status-row">
      <span class="pill" id="pill"><span class="dot"></span><span id="capture-text">未收音</span></span>
      <span class="source" id="source-text"></span>
      <div class="meter" aria-hidden="true"><div id="level"></div></div>
    </div>
    <div class="status-meta">
      <span id="buffer-text">缓存 0:00 / 5:00</span>
      <span class="asr" id="asr-text">识别未连接</span>
    </div>
    <div class="gap-banner" id="gap-banner" hidden></div>
    <div class="speaker-preview-status" id="speaker-preview-status" hidden></div>
    <button class="chip" id="btn-agenda">＋本场目标与议程</button>
    <span class="fine" id="agenda-note"></span><div class="fine" id="sync-note"></div>
    <button class="chip" id="btn-commitments" hidden></button><button class="chip ghost" id="btn-notices" hidden></button>
  </section>

  <main class="transcript" id="transcript">
    <p class="section-title">最近 5 分钟 · 本场纪要保留至下一次收音</p>
    <div class="empty" id="empty">
      开始收音后，最近 5 分钟的对话会出现在这里。<br>
      重要的话不用提前标记，事后点 <b>Oops</b> 就能找回原话。
    </div>
    <div class="pruned-note" id="pruned-note" hidden>更早的字幕已移出列表，本场纪要仍可查看</div>
    <ol id="lines"></ol>
    <div class="partial" id="partial"></div>
  </main>

  <footer class="dock">
    <button class="dock-btn" id="btn-capture">开始收音</button>
    <button class="oops-btn" id="btn-oops" aria-label="Oops，找回刚才那句"><span>Oops</span><small>找回刚才那句</small></button>
    <button class="dock-btn" id="btn-saved">已保存 <b id="saved-count">0</b></button>
  </footer>
  </div>
  <div class="pane page" id="pane-history" hidden></div>
  </div>
  <div class="view page" id="view-tasks" hidden></div>
  <div class="view page" id="view-me" hidden></div>

  <nav class="tabbar" id="tabbar" aria-label="主导航">
    <button class="on" data-tab="session"><span class="tab-icon" aria-hidden="true">◉</span>会话</button>
    <button data-tab="tasks"><span class="tab-icon" aria-hidden="true">✓</span>任务</button>
    <button data-tab="me"><span class="tab-icon" aria-hidden="true">☺</span>我的</button>
  </nav>

  <div class="backdrop" id="backdrop" hidden></div>
  <section class="sheet" id="sheet" hidden aria-live="polite"></section>
  <div id="notices" aria-live="polite"></div>
  <div class="toast" id="toast" hidden></div>

  <script src="bridge-mock.js"></script>
  <script src="draft-state.js"></script>
  <script src="app.js"></script>
</body>
</html>
